<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDG tracker</title>
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="sdg-tracker.webmanifest">
<link rel="icon" href="sdg-icon-192.png">
<link rel="apple-touch-icon" href="sdg-icon-192.png">
<style>
:root{
  --bg:#f5f2ec;--surface:#fff;--surface2:#ece8e0;--text:#1c1a17;--muted:#716b61;--line:#e3ded4;
  --accent:#e7c640;--accent-ink:#7a6200;--accent-soft:#faf1cc;--on-accent:#111;
  --good:#1f8a58;--warn:#b97d0a;--bad:#cf3b3b;
  --pc:#2f7fc1;--cc:#d9692e;--fc:#8e55b5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121110;--surface:#1c1a18;--surface2:#282522;--text:#f2eee7;--muted:#a39c91;--line:#33302b;
  --accent:#e7c640;--accent-ink:#e7c640;--accent-soft:#332b10;--on-accent:#111;
  --good:#3cc184;--warn:#e9ad37;--bad:#ff6b6b;
  --pc:#5aa6e6;--cc:#f08a52;--fc:#b98ae0;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(176px + env(safe-area-inset-bottom))}
.app.notab{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px;min-height:58px;display:flex;align-items:center}
h1{font-size:24px;margin:0;letter-spacing:-.02em;font-weight:750}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.01em;text-transform:uppercase;color:var(--muted);font-weight:650}
.datenav{display:flex;align-items:center;width:100%;justify-content:space-between}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface2);display:grid;place-items:center;font-size:22px;line-height:1}
.iconbtn:disabled{opacity:.35}
.datelbl{border:0;background:none;font-size:19px;font-weight:700;text-align:center}
.datelbl small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* summary */
.summary{display:flex;align-items:center;gap:16px}
.ringbox{position:relative;width:128px;height:128px;flex:none}
.ring{width:128px;height:128px}
.ring circle{fill:none;stroke-width:11}
.ring .track{stroke:var(--surface2)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .prog.over{stroke:var(--bad)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ringtxt span{font-size:11px;color:var(--muted);line-height:1.15;max-width:80px}
.ringtxt.over b{color:var(--bad)}
.stats{flex:1;display:grid;gap:8px;min-width:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.stat:last-child{border:0;padding:0}
.stat span{color:var(--muted);font-size:14px}
.stat b{font-variant-numeric:tabular-nums;font-size:17px}
.stat b.plus{color:var(--good)}

.macros{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.mac span{display:block;font-size:12px;color:var(--muted)}
.mac b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}

.notice{border-color:var(--accent);background:var(--accent-soft)}
.notice p{margin:4px 0 12px}

/* lists */
.list{padding:6px 0}
.lh{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border:0;background:none;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .nm{min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .kc{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.row .kc.plus{color:var(--good)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.linkbtn{display:block;margin:4px auto 0;border:0;background:none;color:var(--accent-ink);font-weight:650;padding:10px}

/* buttons & forms */
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:14px;padding:12px 16px;min-height:46px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:12px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--muted)}
label.f>input,label.f>select,.inp{display:block;width:100%;margin-top:5px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
label.f>input:focus,label.f>select:focus,.inp:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
label.chk{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:15px}
label.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.sumbox{background:var(--surface2);border-radius:14px;padding:12px;font-size:14px}
.sumbox div{display:flex;justify-content:space-between;padding:2px 0}
.sumbox b{font-variant-numeric:tabular-nums}
.warnline{color:var(--warn);font-size:13px;margin-top:6px}
.keyrow{display:flex;gap:8px;align-items:flex-end}
.keyrow label{flex:1;margin:0}

/* composer */
#composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:10;padding:8px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.comp{max-width:536px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow)}
.comp textarea{flex:1;border:0;background:none;resize:none;padding:10px 4px;max-height:120px;font-size:16px;line-height:1.35;outline:none}
.mic,.send{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.mic{background:var(--accent);color:var(--on-accent)}
.cam{width:40px;height:46px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.cam svg{width:23px;height:23px}
.photochip{max-width:536px;margin:0 auto 6px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px;box-shadow:var(--shadow)}
.photochip img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.photochip span{flex:1;font-size:13px;color:var(--muted)}
.qimg{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
.send{background:var(--surface2);color:var(--text)}
.send:disabled{opacity:.4}
.send.busy svg{display:none}
.send.busy::after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid var(--muted);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(207,59,59,.5)}70%{box-shadow:0 0 0 12px rgba(207,59,59,0)}100%{box-shadow:0 0 0 0 rgba(207,59,59,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.mic svg,.send svg{width:22px;height:22px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent-ink);font-weight:650}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 6px;font-size:20px}
.quote{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0 12px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.quote button{border:0;background:none;color:var(--accent-ink);font-weight:650;font-size:13px;white-space:nowrap;padding:0}
.ci{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.ci.act{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ci-top{display:flex;gap:8px;align-items:center}
.ci-name{flex:1;min-width:0;border:0;background:none;font-weight:650;font-size:16px;padding:2px 0;outline:none;border-bottom:1px dashed transparent}
.ci-name:focus{border-bottom-color:var(--muted)}
.x{border:0;background:var(--surface2);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.ci-sub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ci-fields{display:flex;gap:8px}
.ci-fields label{flex:1;display:flex;align-items:center;background:var(--surface2);border-radius:10px;padding:0 10px}
.ci-fields input{width:100%;border:0;background:none;padding:9px 0;font-size:16px;outline:none;font-variant-numeric:tabular-nums}
.ci-fields span{color:var(--muted);font-size:13px}
.ci-mac{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.total{display:flex;justify-content:space-between;font-weight:700;padding:8px 2px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* weight */
.wentry{display:flex;gap:8px;align-items:stretch}
.wentry input{flex:1;min-width:0}
.wentry .inp{margin:0}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wstats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.wstats span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .dot{fill:var(--muted);opacity:.55}
.chart .trend{fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wl:first-child{border:0}
.wl button{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}

.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mh span{white-space:nowrap;font-variant-numeric:tabular-nums}
.meal p{margin:4px 0 10px}
.row2{display:flex;gap:8px}

.mi{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.mi .grid3,.mi .grid2{gap:0 8px}
.mi label.f{margin-bottom:8px}
.mi label.f>input{padding:9px 10px}
.mi-calc{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);min-height:24px}
.mi-calc button{border:0;background:var(--accent-soft);color:var(--accent-ink);font-weight:650;border-radius:8px;padding:3px 9px;font-size:13px}
.unit{border:0;background:none;color:var(--muted);font-size:14px;padding:0 2px;outline:none}
.qrow{display:flex;gap:6px;margin-top:5px}
.qrow .inp{margin:0;flex:1;min-width:0;padding:9px 10px}
.qrow select.inp{flex:none;width:68px}
.skins{display:grid;gap:8px}
.skin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:none;border-radius:14px;padding:10px 12px}
.skin.on{border-color:var(--accent);background:var(--accent-soft)}
.skin b{display:block;font-size:15px}
.skin small{color:var(--muted);font-size:13px}
.dots{display:flex;flex:none}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;box-shadow:0 0 0 1px var(--line)}
.dots i:first-child{margin-left:0}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:30;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:all .25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="skinovi/osnovni.css" id="skinLink">
<script>try{var sk=JSON.parse(localStorage.getItem('zalogaj-v1')||'{}').settings;sk=sk&&sk.skin;if(sk&&sk!=='osnovni'&&/^[a-z0-9-]+$/.test(sk))document.getElementById('skinLink').href='skinovi/'+sk+'.css';}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="hdr"></header>
  <main id="view"></main>
</div>

<div id="composer">
  <div class="photochip" id="photoChip" hidden><img id="photoImg" alt=""><span>Fotografija priložena · možeš dodati opis</span>
    <button class="x" data-act="photodel" aria-label="Ukloni fotografiju">×</button></div>
  <div class="comp">
    <button class="mic" id="mic" aria-label="Diktiraj">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <textarea id="inp" rows="1" enterkeyhint="send" placeholder="Što si jeo ili radio?"></textarea>
    <button class="cam" id="cam" aria-label="Fotografiraj obrok">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
    </button>
    <input type="file" id="photoIn" accept="image/*" hidden>
    <button class="send" id="send" aria-label="Obradi" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<nav class="tabs"><div class="in">
  <button data-tab="dan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z" fill="currentColor" stroke="none"/></svg>Dan</button>
  <button data-tab="tezina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Težina</button>
  <button data-tab="obroci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v8a3 3 0 0 0 3 3v7M8 3v6M11 3v8a3 3 0 0 1-3 3"/><path d="M17 21V3c-2 1-3 4-3 8h3"/></svg>Obroci</button>
  <button data-tab="postavke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Postavke</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="impFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'zalogaj-v1';
const API = 'https://api.anthropic.com/v1/messages';
const DEF = {skin:'osnovni', apiKey:'', model:'claude-haiku-5-5', sex:'m', age:'', height:'', activity:1.375, goalRate:-0.25,
             proteinPerKg:1.8, addExercise:true, autoProcess:true, useAdaptive:false, stepsBaseline:3000};
const NUMKEYS = ['age','height','activity','goalRate','proteinPerKg','stepsBaseline'];
const MEALS = ['doručak','ručak','večera','užina'];
const DAYN = ['ned','pon','uto','sri','čet','pet','sub'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r1 = v => Math.round((+v || 0) * 10) / 10;
const fmt = (n, d = 0) => (+n || 0).toLocaleString('hr-HR', {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), d);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const dayDiff = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const labelDate = k => { const d = parseKey(k); return `${DAYN[d.getDay()]}, ${d.getDate()}. ${d.getMonth() + 1}.`; };
const shortDate = k => { const d = parseKey(k); return `${d.getDate()}.${d.getMonth() + 1}.`; };

/* ---------- storage ---------- */
function loadDb() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  d = d || {};
  return {settings:{...DEF, ...(d.settings || {})}, days:d.days || {}, weights:d.weights || {}, meals:d.meals || []};
}
let db = loadDb();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Spremanje nije uspjelo: ' + e.message); }
}
const S = () => db.settings;

let tab = 'dan', cur = todayKey(), pending = null, busy = false, wRange = 30, editKind = 'food';

/* ---------- calculations ---------- */
const entriesOf = k => db.days[k]?.entries || [];
function stepsKcal(steps, k) {
  const w = weightAt(k) || weightAt(todayKey()) || 80;
  return Math.round(Math.max(0, (+steps || 0) - (+S().stepsBaseline || 0)) * w * 0.0004);
}
function totals(k) {
  const st = +db.days[k]?.steps || 0;
  const t = {kcal:0, p:0, c:0, f:0, act:st ? stepsKcal(st, k) : 0, steps:st};
  for (const e of entriesOf(k)) {
    if (e.kind === 'activity') t.act += +e.kcal || 0;
    else { t.kcal += +e.kcal || 0; t.p += +e.p || 0; t.c += +e.c || 0; t.f += +e.f || 0; }
  }
  return t;
}
function weightAt(k) {
  const ks = Object.keys(db.weights).sort();
  if (!ks.length) return null;
  let w = db.weights[ks[0]];
  for (const x of ks) { if (x <= k) w = db.weights[x]; else break; }
  return +w;
}
function bmr(w) {
  const s = S();
  if (!w || !s.age || !s.height) return null;
  return 10 * w + 6.25 * s.height - 5 * s.age + (s.sex === 'f' ? -161 : 5);
}
function adaptive() {
  const end = addDays(todayKey(), -1), start = addDays(end, -27);
  const ks = [];
  for (let k = start; k <= end; k = addDays(k, 1)) ks.push(k);
  const wp = ks.filter(k => db.weights[k] != null).map(k => [dayDiff(start, k), +db.weights[k]]);
  const fd = ks.filter(k => entriesOf(k).some(e => e.kind !== 'activity'));
  if (wp.length < 8 || fd.length < 14) return {ready:false, wn:wp.length, fn:fd.length};
  const n = wp.length, mx = wp.reduce((a, p) => a + p[0], 0) / n, my = wp.reduce((a, p) => a + p[1], 0) / n;
  let sxy = 0, sxx = 0;
  for (const [x, y] of wp) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; }
  const slope = sxx ? sxy / sxx : 0;
  const avgIn = fd.reduce((a, k) => a + totals(k).kcal, 0) / fd.length;
  const avgAct = fd.reduce((a, k) => a + totals(k).act, 0) / fd.length;
  const total = avgIn - slope * 7700;
  const base = S().addExercise ? total - avgAct : total;
  if (base < 1000 || base > 6000) return {ready:false, wn:wp.length, fn:fd.length, odd:true};
  return {ready:true, total:Math.round(total), base:Math.round(base), weekly:slope * 7, avgIn:Math.round(avgIn), n:fd.length};
}
function formulaTdee(k) { const b = bmr(weightAt(k)); return b ? b * S().activity : null; }
function baseTdee(k) {
  if (S().useAdaptive) { const a = adaptive(); if (a.ready) return a.base; }
  return formulaTdee(k);
}
function target(k) { const t = baseTdee(k); return t == null ? null : Math.round(t + S().goalRate * 7700 / 7); }
function mealByTime(d = new Date()) {
  const h = d.getHours();
  return h < 10 ? 'doručak' : h < 12 ? 'užina' : h < 16 ? 'ručak' : h < 18 ? 'užina' : h < 22 ? 'večera' : 'užina';
}

function dayHtml() {

  }
  const budget = tgt != null ? tgt + (s.addExercise ? t.act : 0) : null;
  const left = budget != null ? Math.round(budget - t.kcal) : null;
  const C = 2 * Math.PI * 52, frac = budget ? Math.min(t.kcal / budget, 1) : 0, over = left != null && left < 0;
  h += `<section class="card summary">
    <div class="ringbox">
      <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="track"/>
      <circle cx="60" cy="60" r="52" class="prog ${over ? 'over' : ''}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 60 60)"/></svg>
      <div class="ringtxt ${over ? 'over' : ''}"><b>${left == null ? fmt(t.kcal) : fmt(Math.abs(left))}</b>
      <span>${left == null ? 'kcal uneseno' : over ? 'kcal preko cilja' : 'kcal preostalo'}</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span>Cilj</span><b>${tgt == null ? '–' : fmt(tgt)}</b></div>
      <div class="stat"><span>Hrana</span><b>${fmt(t.kcal)}</b></div>
      <div class="stat"><span>Aktivnost</span><b class="${t.act ? 'plus' : ''}">${t.act ? '+' + fmt(t.act) : '0'}</b></div>
    </div></section>`;
  const protT = w ? Math.round(w * s.proteinPerKg) : null;
  const pPct = protT ? Math.min(t.p / protT, 1) * 100 : 0;
  const kc = t.kcal || 1;
  h += `<section class="card macros">
    <div class="mac"><span>Proteini</span><b>${fmt(t.p)}</b>${protT ? ` <span style="display:inline" class="small">/ ${protT} g</span>` : ' g'}
      <div class="bar"><i style="width:${pPct}%;background:var(--pc)"></i></div></div>
    <div class="mac"><span>Ugljikohidrati</span><b>${fmt(t.c)} g</b>
      <div class="bar"><i style="width:${t.kcal ? t.c * 4 / kc * 100 : 0}%;background:var(--cc)"></i></div></div>
    <div class="mac"><span>Masti</span><b>${fmt(t.f)} g</b>
      <div class="bar"><i style="width:${t.kcal ? t.f * 9 / kc * 100 : 0}%;background:var(--fc)"></i></div></div>
  </section>`;

  const es = entriesOf(k);
  if (!es.length && !t.steps) {
    h += `<div class="empty"><b>Još ništa za ovaj dan</b>Pritisni mikrofon i reci npr.<br>„za doručak tri jaja i kriška kruha“<br>ili „trčao sam 30 minuta lagano“.</div>`;
  } else {
    const groups = {};
    for (const e of es) {
      const g = e.kind === 'activity' ? 'aktivnost' : (MEALS.includes(e.meal) ? e.meal : 'ostalo');
      (groups[g] ||= []).push(e);
    }
    if (t.steps) groups.aktivnost ||= [];
    for (const g of [...MEALS, 'ostalo', 'aktivnost']) {
      if (!groups[g]) continue;
      const act = g === 'aktivnost';
      const sum = groups[g].reduce((a, e) => a + (+e.kcal || 0), 0) + (act && t.steps ? stepsKcal(t.steps, k) : 0);
      const stepRow = act && t.steps ? `<button class="row" data-act="steps"><span class="nm">Koraci<small>${fmt(t.steps)} ukupno · računa se iznad ${fmt(S().stepsBaseline)}</small></span>
          <span class="kc plus">+${fmt(stepsKcal(t.steps, k))}</span></button>` : '';
      h += `<div class="card list"><div class="lh"><span>${g}</span><span class="num">${act ? '+' : ''}${fmt(sum)} kcal</span></div>
        ${stepRow}${groups[g].map(e => `<button class="row" data-act="edit" data-id="${e.id}">
          <span class="nm">${esc(e.name)}<small>${esc(e.amount || (act && e.minutes ? e.minutes + ' min' : e.grams ? fmt(e.grams) + ' ' + (e.unit === 'ml' ? 'ml' : 'g') : ''))}</small></span>

}

/* weight */
function weightSeries() {
  const ks = Object.keys(db.weights).sort();
  let ema = null, prev = null;
  return ks.map(k => {
    const w = +db.weights[k];
    if (ema == null) ema = w;
    else { const a = 1 - Math.pow(0.9, Math.max(1, dayDiff(prev, k))); ema += a * (w - ema); }
    prev = k;
    return {k, w, t:ema};
  });
}
function trendChange(ser, days) {
  if (ser.length < 2) return null;
  const last = ser.at(-1), from = addDays(last.k, -days);
  if (ser[0].k > from) return null;
  let base = ser[0];
  for (const p of ser) { if (p.k <= from) base = p; else break; }
  return last.t - base.t;
}
function weightHtml() {
  const t = todayKey(), ser = weightSeries(), last = ser.at(-1);
  const c7 = trendChange(ser, 7), c30 = trendChange(ser, 30);
  let h = `<div class="card"><h2>Vaganje</h2>
    <div class="wentry"><input class="inp" id="wDate" type="date" value="${t}" max="${t}" style="flex:1.3">
    <input class="inp" id="wIn" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="kg" value="${db.weights[t] ?? ''}">
    <button class="btn" data-act="wsave">Spremi</button></div>
    <p class="muted small" style="margin:8px 0 0">Najbolje ujutro, nakon WC-a, prije jela. Trend izglađuje dnevne oscilacije vode.</p></div>`;
  if (last) {

      <div><b>${c30 == null ? '–' : sgn(c30)}</b><span>30 dana</span></div></div>`;
    const from = wRange ? addDays(last.k, -wRange) : '0000';

        .map(([v, l]) => `<button data-act="wrange" data-v="${v}" class="${wRange === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${chartSvg(ser.filter(p => p.k >= from))}</div>`;
  }
  const a = adaptive(), ft = formulaTdee(t);
  h += `<div class="card"><h2>Stvarna potrošnja</h2>`;
  if (a.ready) {
    h += `<div class="sumbox">
      <div><span>Iz tvojih podataka (4 tj.)</span><b>${fmt(a.total)} kcal</b></div>
      <div><span>Formula (Mifflin-St Jeor)</span><b>${ft ? fmt(ft) + ' kcal' : '–'}</b></div>

      <label class="chk" style="margin-top:12px"><input type="checkbox" data-s="useAdaptive" ${S().useAdaptive ? 'checked' : ''}> Koristi ovu procjenu za dnevni cilj</label>
      <p class="muted small" style="margin:0">Pretpostavlja da su dani s unosom hrane zabilježeni u cijelosti.</p>`;
  } else {
    h += `<p class="muted small" style="margin:0">${a.odd ? 'Podaci za sada daju nerealnu procjenu – vjerojatno nisu svi obroci zabilježeni.' :
      `Kad skupiš dovoljno podataka, izračunat ću stvarnu potrošnju iz unosa i promjene težine. Treba: <b>${a.fn}/14</b> dana s unosom hrane i <b>${a.wn}/8</b> vaganja u zadnja 4 tjedna.`}</p>`;
  }
  h += `</div>`;
  if (ser.length) {
    h += `<div class="card"><h2>Zadnja vaganja</h2>${ser.slice(-14).reverse().map(p =>
      `<div class="wl"><span>${labelDate(p.k)}</span><span><b class="num">${fmt(p.w, 1)}</b> kg <button data-act="wdel" data-k="${p.k}" aria-label="Obriši">×</button></span></div>`).join('')}</div>`;
  }
  return h;
}
function chartSvg(ser) {
  if (ser.length < 2) return `<p class="muted small">Graf se pojavljuje nakon dva vaganja u odabranom razdoblju.</p>`;
  const W = 340, H = 180, L = 34, R = 8, T = 10, B = 22;
  const x0 = ser[0].k, span = Math.max(1, dayDiff(x0, ser.at(-1).k));
  let mn = Math.min(...ser.map(p => Math.min(p.w, p.t))), mx = Math.max(...ser.map(p => Math.max(p.w, p.t)));
  if (mx - mn < 1) { const m = (mx + mn) / 2; mn = m - .5; mx = m + .5; }
  const padv = (mx - mn) * .1; mn -= padv; mx += padv;
  const X = k => L + (W - L - R) * dayDiff(x0, k) / span, Y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = mn + (mx - mn) * i / 3, y = Y(v).toFixed(1);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 5}" y="${+y + 3}" text-anchor="end">${fmt(v, 1)}</text>`;
  }
  g += `<text x="${L}" y="${H - 6}">${shortDate(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(ser.at(-1).k)}</text>`;
  const dots = ser.map(p => `<circle class="dot" cx="${X(p.k).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${ser.length > 90 ? 1.8 : 3}"/>`).join('');
  const path = ser.map((p, i) => `${i ? 'L' : 'M'}${X(p.k).toFixed(1)},${Y(p.t).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf težine">${g}${dots}<path class="trend" d="${path}"/></svg>`;
}

/* ---------- Claude ---------- */
function systemPrompt(w, dateKey) {
  const now = new Date();
  const meals = db.meals.map(m => ({naziv:m.name, stavke:m.items.map(i => ({naziv:i.name, kolicina:i.amount, grami:i.grams, jedinica:i.unit || 'g', kcal:i.kcal, proteini:i.p, ugljikohidrati:i.c, masti:i.f}))}));
  return `Ti si nutricionistički asistent u aplikaciji za praćenje kalorija. Korisnik na hrvatskom (često diktirano glasom, pa su moguće greške prepoznavanja govora) opisuje što je pojeo ili popio i/ili koju je tjelesnu aktivnost odradio. Sve pretvori u stavke pomoću alata zapisi_unos.

HRANA
- Svaku namirnicu zapiši kao zasebnu stavku. Složeno jelo (sarma, gulaš, pizza, burek, sendvič iz pekare) može biti jedna stavka.
- Ako količina nije navedena, pretpostavi uobičajenu porciju odrasle osobe u Hrvatskoj. U polju kolicina čitljivo napiši količinu i grame, npr. "2 kriške (60 g)".
- Procijeni grame, kcal, proteine, ugljikohidrate i masti prema standardnim nutritivnim tablicama. Budi realan; ulje, maslac i umaci često podižu kalorije.
- Uzmi u obzir način pripreme ako je naveden (prženo, pohano, na žaru, kuhano).
- Pića s kalorijama (sok, pivo, vino, kava s mlijekom ili šećerom, proteinski shake) su hrana. Voda, crna kava i nezaslađeni čaj zapisuju se samo ako su izričito spomenuti, s ~0 kcal.
- Ako korisnik spomene neki od spremljenih obroka s popisa ispod, upotrijebi točno njegove stavke i vrijednosti (skaliraj ako je količina drukčija).
- jedinica: "ml" za pića i tekućine (mlijeko, sok, shake, jogurt za piće, pivo, vino), inače "g". Polje grami tada sadrži mililitre.
- obrok: doručak, ručak, večera ili užina – prema tekstu, a ako nije rečeno, prema vremenu unosa.
- sigurnost: "niska" kad je porcija ili sastav vrlo nejasan, "srednja" za uobičajene procjene, "visoka" kad su grami ili proizvod jasno navedeni.

FOTOGRAFIJA
- Ako je priložena fotografija obroka, prepoznaj namirnice i procijeni porcije prema vizualnim referencama (veličina tanjura ~26 cm, pribor, ruka, pakiranje).
- Ako tekst navodi količinu ili koliko je pojedeno ("pojeo sam pola"), tekst ima prednost pred procjenom sa slike.
- Ako je na fotografiji nutritivna deklaracija ili pakiranje, očitaj vrijednosti (na 100 g/ml) i preračunaj na navedenu količinu; ako količina nije navedena, uzmi jednu uobičajenu porciju i to napiši.
- Kad je porcija na slici teško procjenjiva (zdjela s dubinom, skriveni umaci, ulje), stavi sigurnost "niska".

AKTIVNOST
- Za SVAKU aktivnost obavezno navedi minute (ukupno aktivno vrijeme) i met (MET vrijednost). Nikad ne vraćaj aktivnost bez njih.
- Runde i serije pretvori u minute: "4 runde po 5 minuta" = 20 minuta. Ako je spomenut i odmor između rundi, ne ubrajaj ga.
- MET vrijednosti prema Compendium of Physical Activities, na primjer: trening snage s utezima 3,5–6; jiu-jitsu, judo, hrvanje, kickboxing, krav maga – sparing ili rolanje 10, drilovi i tehnika 5–6; trčanje lagano 8, umjereno 10; hodanje 3–4; bicikl umjereno 7–8.
- kcal izračunaj kao NETO potrošnju: (MET − 1) × tjelesna masa × minute / 60. Bazalni metabolizam je već uračunat drugdje.
- Ako trajanje nije navedeno, pretpostavi uobičajeno i to navedi u polju kolicina.

KORACI
- Ako korisnik spomene broj koraka, NE zapisuj ga kao stavku, nego u polje koraci upiši UKUPNO stanje koraka za taj dan.
- "Zasad sam na 2000 koraka", "evo na 6000", "danas 11 tisuća koraka" = to je novo ukupno stanje (2000, 6000, 11000), ne zbrajaj s prethodnim.
- Samo ako izričito kaže dodatak ("još 2000 koraka", "napravio sam dodatnih 3000"), zbroji ga s trenutnim stanjem iz konteksta.

OSTALO
- Ako tekst ne sadrži ni hranu, ni aktivnost, ni korake, vrati praznu listu stavki i kratko objasni u polju napomena.
- Napomene piši kratko, na hrvatskom.

KONTEKST
- Datum unosa: ${dateKey}${dateKey === todayKey() ? `, trenutno vrijeme ${pad(now.getHours())}:${pad(now.getMinutes())}` : ' (naknadni unos za raniji dan)'}
- Tjelesna masa korisnika: ${w} kg
- Trenutno zabilježeni koraci za taj dan: ${+db.days[dateKey]?.steps || 0}
- Spremljeni obroci: ${meals.length ? JSON.stringify(meals) : 'nema'}`;
}
const TOOL = {

async function callClaude(body) {
  const s = S(), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  let r;
  try {
    r = await fetch(API, {method:'POST', signal:ctl.signal, headers:{
      'content-type':'application/json', 'x-api-key':s.apiKey.trim(), 'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:s.model, ...body})});
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Zahtjev je predugo trajao. Pokušaj ponovno.' : 'Nema veze s poslužiteljem. Provjeri internet.');
  } finally { clearTimeout(timer); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j?.error?.message || r.statusText;
    if (r.status === 401) throw new Error('API ključ nije ispravan.');
    if (r.status === 429) throw new Error('Previše zahtjeva – pokušaj za minutu.');
    if (r.status === 529 || r.status === 503) throw new Error('Claude je trenutno preopterećen. Pokušaj ponovno.');
    if (/credit/i.test(m)) throw new Error('Na API računu nema kredita. Nadoplati u Claude Consoleu.');
    throw new Error(`Greška ${r.status}: ${m}`);
  }
  return j;
}
async function askClaude(text, ph) {
  const w = weightAt(cur) || weightAt(todayKey()) || 80;
  const content = ph ? [{type:'image', source:{type:'base64', media_type:'image/jpeg', data:ph.data}},
                        {type:'text', text:text || 'Procijeni obrok na fotografiji.'}] : text;
  const j = await callClaude({max_tokens:2000, system:systemPrompt(w, cur), tools:[TOOL],
    tool_choice:{type:'tool', name:'zapisi_unos'}, messages:[{role:'user', content}]});
  const tu = (j.content || []).find(b => b.type === 'tool_use');
  if (!tu || !Array.isArray(tu.input?.stavke)) throw new Error('Odgovor nije u očekivanom obliku. Pokušaj ponovno.');
  return tu.input;
}

async function shrinkPhoto(file) {
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch (e) {
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const k = Math.min(1, 1024 / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.82);
  return {url, data:url.split(',')[1]};
}
function setBusy(b) { busy = b; $('#send').classList.toggle('busy', b); autosize(); }
async function processInput() {

function normItem(x) {
  const act = x.vrsta === 'aktivnost';

    kcal:Math.round(+x.kcal || 0), p:act ? 0 : r1(x.proteini), c:act ? 0 : r1(x.ugljikohidrati), f:act ? 0 : r1(x.masti),
    meal:act ? '' : (MEALS.includes(x.obrok) ? x.obrok : mealByTime()), conf:x.sigurnost || ''};
  if (act) {
    it.met = +x.met || 0;
    const w = weightAt(cur) || weightAt(todayKey()) || 80;

function onConfirmInput(el) {
  const row = el.closest('.ci'); if (!row || !pending) return;

  if (f === 'grams' || f === 'minutes') {

function entryForm(e) {
  const isNew = !e, kind = e ? e.kind : editKind, food = kind === 'food';
  e = e || {name:'', amount:'', grams:'', minutes:'', kcal:'', p:'', c:'', f:'', meal:mealByTime()};
  return `<h3>${isNew ? 'Ručni unos' : 'Uredi stavku'}</h3>
    ${isNew ? `<div class="seg"><button data-act="kind" data-k="food" class="${food ? 'on' : ''}">Hrana</button><button data-act="kind" data-k="activity" class="${food ? '' : 'on'}">Aktivnost</button></div>` : ''}
    <label class="f">Naziv<input id="eName" value="${esc(e.name)}"></label>
    <label class="f">Količina (opis)<input id="eAmount" value="${esc(e.amount)}" placeholder="${food ? 'npr. 1 tanjur' : 'npr. 45 min, umjereno'}"></label>
    <div class="grid2">${food ? `<label class="f">Količina<div class="qrow"><input class="inp" id="eQ" type="number" inputmode="decimal" value="${e.grams ?? ''}"><select id="eUnit" class="inp" >${['g','ml'].map(u => `<option ${u === (e.unit || 'g') ? 'selected' : ''}>${u}</option>`).join('')}</select></div></label>`
                             : `<label class="f">Minute<input id="eQ" type="number" inputmode="numeric" value="${e.minutes ?? ''}"></label>`}
      <label class="f">kcal<input id="eKcal" type="number" inputmode="numeric" value="${e.kcal ?? ''}"></label></div>
    ${food ? `<div class="grid3"><label class="f">Proteini g<input id="eP" type="number" inputmode="decimal" value="${e.p ?? ''}"></label>
      <label class="f">UH g<input id="eC" type="number" inputmode="decimal" value="${e.c ?? ''}"></label>
      <label class="f">Masti g<input id="eF" type="number" inputmode="decimal" value="${e.f ?? ''}"></label></div>
      <label class="f">Obrok<select id="eMeal">${MEALS.map(m => `<option ${m === e.meal ? 'selected' : ''}>${m}</option>`).join('')}</select></label>` : ''}
    <div class="btns">${isNew ? `<button class="btn ghost" data-act="close">Odustani</button>` : `<button class="btn danger" data-act="edel" data-id="${e.id}">Obriši</button>`}
      <button class="btn" data-act="esave" data-id="${isNew ? '' : e.id}" data-kind="${kind}">Spremi</button></div>`;
}
function saveEntry(id, kind) {
  const num = s => { const v = parseFloat(($(s)?.value || '').replace(',', '.')); return isNaN(v) ? 0 : v; };
  const name = $('#eName').value.trim(), kcal = Math.round(num('#eKcal'));
  if (!name) { toast('Upiši naziv'); return; }
  const food = kind === 'food';
  const data = {name, amount:$('#eAmount').value.trim(), kcal,
    grams:food ? (num('#eQ') || null) : null, unit:food ? ($('#eUnit')?.value || 'g') : undefined, minutes:food ? null : (num('#eQ') || null),
    p:food ? r1(num('#eP')) : 0, c:food ? r1(num('#eC')) : 0, f:food ? r1(num('#eF')) : 0, meal:food ? $('#eMeal').value : ''};
  const day = (db.days[cur] ||= {entries:[]});
  if (id) Object.assign(day.entries.find(x => x.id === id) || {}, data);
  else day.entries.push({id:uid(), kind, ts:Date.now(), ...data});
  save(); closeSheet(); render();
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function setMic(on) { listening = on; $('#mic').classList.toggle('on', on); $('#mic').setAttribute('aria-label', on ? 'Zaustavi' : 'Diktiraj'); }
function toggleMic() {
  if (listening) { rec?.stop(); return; }
  if (!SR) { toast('Ovaj preglednik ne podržava diktiranje. Koristi mikrofon na tipkovnici.', 4500); inp.focus(); return; }
  const before = inp.value.trim();
  let finalText = '';
  rec = new SR();
  rec.lang = 'hr-HR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let fin = '', interim = '';
    for (const r of e.results) (r.isFinal ? (fin += r[0].transcript + ' ') : (interim += r[0].transcript));
    finalText = fin.trim();
    inp.value = [before, (fin + interim).trim()].filter(Boolean).join(' ');
    autosize();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Dopusti pristup mikrofonu u postavkama preglednika.', 4500);
    else if (e.error === 'network') toast('Diktiranje treba internetsku vezu.');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Greška diktiranja: ' + e.error);
  };
  rec.onend = () => { setMic(false); if (finalText && S().autoProcess) processInput(); };
  try { rec.start(); setMic(true); } catch (e) { toast('Diktiranje nije uspjelo pokrenuti.'); }
}

/* ---------- misc ---------- */
let toastT;
function toast(msg, ms = 2500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
function exportData() {
  const data = {...db, settings:{...db.settings, apiKey:''}};
  const blob = new Blob([JSON.stringify({app:'sdg-tracker', version:1, exported:new Date().toISOString(), data}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `sdg-tracker-kopija-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file) {
  try {
    const j = JSON.parse(await file.text()), d = j.data || j;
    if (typeof d.days !== 'object' || typeof d.weights !== 'object') throw new Error();
    if (!confirm('Uvoz će zamijeniti sve trenutne podatke. Nastaviti?')) return;
    const key = db.settings.apiKey;
    db = {settings:{...DEF, ...(d.settings || {}), apiKey:key}, days:d.days || {}, weights:d.weights || {}, meals:d.meals || []};
    save(); render(); toast('Podaci uvezeni');
  } catch (e) { toast('Datoteka nije ispravna kopija.'); }
}
async function testKey() {
  if (!S().apiKey.trim()) { toast('Upiši ključ'); return; }
  const b = $('#testBtn'); b.disabled = true; b.textContent = 'Provjeravam…';
  try { await callClaude({max_tokens:5, messages:[{role:'user', content:'Odgovori samo: ok'}]}); toast('Ključ radi ✓'); }
  catch (e) { toast(e.message, 4500); }
  finally { b.disabled = false; b.textContent = 'Testiraj ključ'; }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tab]');
  if (!el) return;
  if (el.closest('nav.tabs') && el.dataset.tab) { tab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'prev': cur = addDays(cur, -1); render(); break;
    case 'next': if (cur < todayKey()) { cur = addDays(cur, 1); render(); } break;
    case 'today': cur = todayKey(); render(); break;
    case 'close': closeSheet(); break;
    case 'retext': { const t = pending?.text || '', ph = pending?.photo || null; closeSheet(); inp.value = t; setPhoto(ph); setTimeout(() => inp.focus(), 300); break; }
    case 'photodel': setPhoto(null); break;
    case 'cidel': pending.items.splice(+el.dataset.i, 1); renderConfirm(); break;
    case 'cistdel': pending.steps = null; renderConfirm(); break;
    case 'steps': openSheet(`<h3>Koraci</h3>
      <label class="f">Ukupno koraka – ${labelDate(cur)}<input id="stIn" type="number" inputmode="numeric" value="${db.days[cur]?.steps || ''}"></label>
      <p class="muted small" style="margin:-4px 0 0">Upisuje se stanje, ne dodatak. Kalorije se računaju za korake iznad ${fmt(S().stepsBaseline)}.</p>
      <div class="btns"><button class="btn danger" data-act="stdel">Obriši</button><button class="btn" data-act="stsave">Spremi</button></div>`); break;
    case 'stsave': { const v = Math.round(+$('#stIn').value); if (!(v >= 0)) { toast('Upiši broj koraka'); break; }
      (db.days[cur] ||= {entries:[]}).steps = v; save(); closeSheet(); render(); break; }
    case 'stdel': if (db.days[cur]) delete db.days[cur].steps; save(); closeSheet(); render(); break;
    case 'confirm': saveConfirm(); break;
    case 'manual': editKind = 'food'; openSheet(entryForm(null)); break;
    case 'kind': editKind = el.dataset.k; openSheet(entryForm(null)); break;
    case 'edit': { const en = entriesOf(cur).find(x => x.id === id); if (en) openSheet(entryForm(en)); break; }
    case 'esave': saveEntry(id, el.dataset.kind); break;
    case 'edel': { const d = db.days[cur]; if (d) d.entries = d.entries.filter(x => x.id !== id); save(); closeSheet(); render(); break; }
    case 'wsave': {
      const v = parseFloat(($('#wIn').value || '').replace(',', '.')), k = $('#wDate').value || todayKey();
      if (!(v > 25 && v < 350)) { toast('Upiši ispravnu težinu'); break; }
      db.weights[k] = r1(v); save(); render(); toast('Težina spremljena'); break;
    }
    case 'wdel': delete db.weights[el.dataset.k]; save(); render(); break;
    case 'wrange': wRange = +el.dataset.v; render(); break;
    case 'mealadd': {
      const m = db.meals.find(x => x.id === id); if (!m) break;
      const day = (db.days[cur] ||= {entries:[]}), meal = cur === todayKey() ? mealByTime() : (m.items[0]?.meal || 'ručak');
      for (const it of m.items) day.entries.push({...it, id:uid(), kind:'food', meal, mealRef:m.id, ts:Date.now()});
      save(); tab = 'dan'; render(); toast(`Dodano: ${m.name}`); break;
    }
    case 'mealdel': if (confirm('Obrisati spremljeni obrok?')) { db.meals = db.meals.filter(x => x.id !== id); save(); if (mealDraft) closeSheet(); render(); } break;
    case 'mealedit': { const m = db.meals.find(x => x.id === id); if (!m) break; mealDraft = JSON.parse(JSON.stringify(m));
      mealDraft.items.forEach(i => i._src = i.name); renderMealEdit(); break; }
    case 'midel': mealDraft.items.splice(+el.dataset.i, 1); renderMealEdit(); break;
    case 'miadd': mealDraft.items.push({kind:'food', name:'', amount:'', grams:null, minutes:null, kcal:0, p:0, c:0, f:0, meal:''}); renderMealEdit();
      setTimeout(() => document.querySelector('#sheet .mi:last-of-type .ci-name')?.focus(), 50); break;
    case 'miuse': { const row = el.closest('.mi'), it = mealDraft.items[+row.dataset.i]; it.kcal = macroKcal(it);
      row.querySelector('[data-mf="kcal"]').value = it.kcal; onMealInput(row.querySelector('[data-mf="kcal"]')); break; }
    case 'mealsave': {
      const d = mealDraft; d.name = d.name.trim() || 'Obrok';
      const kept = d.items.filter(i => (i.name || '').trim() || +i.kcal);
      d.items = d.items.filter(i => (i.name || '').trim() || +i.kcal).map(({_src, ...i}) => ({...i, name:(i.name || '').trim() || 'Namirnica',
        kcal:Math.round(+i.kcal || 0), p:r1(i.p), c:r1(i.c), f:r1(i.f), grams:i.grams ? Math.round(i.grams) : null, unit:i.unit === 'ml' ? 'ml' : 'g'}));
      if (!d.items.length) { toast('Obrok treba barem jednu namirnicu'); break; }
      const ix = db.meals.findIndex(x => x.id === d.id); if (ix >= 0) db.meals[ix] = d;
      // ažuriraj već upisane unose ovog obroka na prikazanom danu
      const es = entriesOf(cur), hits = [];
      kept.forEach((src, i) => { if (!src._src) return;
        for (const e of es) if (e.kind !== 'activity' && (e.mealRef ? e.mealRef === d.id : true) && e.name === src._src) hits.push([e, d.items[i]]); });
      if (hits.length && confirm(`${labelDate(cur)} već ima ${hits.length === 1 ? 'unos' : hits.length + ' unosa'} iz ovog obroka. Ažurirati i ${hits.length === 1 ? 'njega' : 'njih'}?`)) {
        for (const [e, it] of hits) Object.assign(e, {name:it.name, amount:it.amount, grams:it.grams, unit:it.unit, kcal:it.kcal, p:it.p, c:it.c, f:it.f, mealRef:d.id});
      }
      save(); closeSheet(); render(); toast('Obrok spremljen'); break;
    }
    case 'showkey': { const k = $('#keyIn'); k.type = k.type === 'password' ? 'text' : 'password'; el.textContent = k.type === 'password' ? 'Prikaži' : 'Sakrij'; break; }
    case 'testkey': testKey(); break;
    case 'skin': { const v = el.dataset.id || 'osnovni'; if (!/^[a-z0-9-]+$/.test(v)) break;
      db.settings.skin = v; save(); applySkin(v); renderSkins(); break; }
    case 'export': exportData(); break;
    case 'import': $('#impFile').click(); break;
    case 'wipe':
      if (confirm('Obrisati SVE unose, težine i obroke? Ovo se ne može poništiti.')) {
        const key = db.settings.apiKey; db = loadDb(); db = {settings:{...db.settings, apiKey:key}, days:{}, weights:{}, meals:[]};
        save(); render(); toast('Podaci obrisani');
      }
      break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cSteps' && pending) {
    const v = Math.round(+e.target.value); pending.steps = v > 0 ? v : null;
    $('#cStepsK').textContent = '+' + fmt(stepsKcal(v, cur)) + ' kcal'; return;
  }
  if (mealDraft && (e.target.id === 'mName' || e.target.closest('#sheet .mi'))) { onMealInput(e.target); return; }
  if (e.target.closest('#sheet .ci')) onConfirmInput(e.target);
  if (e.target.id === 'cSaveName') return;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'cSave') { $('#cSaveName').style.display = el.checked ? 'block' : 'none'; if (el.checked) $('#cSaveName').focus(); return; }
  if (el.id === 'impFile') { if (el.files[0]) importData(el.files[0]); el.value = ''; return; }
  if (el.id === 'setW') {
    const v = parseFloat(el.value.replace(',', '.'));
    if (v > 25 && v < 350) { db.weights[todayKey()] = r1(v); save(); updateSumBox(); }
    return;
  }
  if (el.dataset.s) {
    const k = el.dataset.s;
    db.settings[k] = el.type === 'checkbox' ? el.checked : NUMKEYS.includes(k) ? (el.value === '' ? '' : +el.value) : el.value.trim();
    save();
    if (tab === 'postavke') updateSumBox(); else render();
  }
});
$('#scrim').addEventListener('click', closeSheet);
$('#mic').addEventListener('click', toggleMic);
$('#send').addEventListener('click', processInput);
$('#cam').addEventListener('click', () => $('#photoIn').click());
$('#photoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { setPhoto(await shrinkPhoto(f)); }
  catch (err) { toast('Fotografiju nije moguće učitati.'); }
});
inp.addEventListener('input', autosize);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); processInput(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'dan') render(); });

render(); autosize();
function syncThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (bg) document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = bg);
}
window.addEventListener('load', syncThemeColor);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', syncThemeColor);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
navigator.storage?.persist?.().catch(() => {});
</script>
