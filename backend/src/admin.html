<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CalQuest Admin</title>
<style>
:root{--bg:#f5f2ec;--surface:#fff;--surface2:#ece8e0;--text:#1c1a17;--muted:#716b61;--line:#e3ded4;
  --accent:#e7c640;--accent-ink:#7a6200;--good:#1f8a58;--bad:#cf3b3b;--warn:#b97d0a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--surface:#1c1a18;--surface2:#282522;--text:#f2eee7;--muted:#a39c91;--line:#33302b;
  --accent:#e7c640;--accent-ink:#e7c640;--good:#3cc184;--bad:#ff6b6b;--warn:#e9ad37;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}h1 span{color:var(--muted);font-weight:500}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{display:block;font-size:12px;color:var(--muted)}.tile b{font-size:20px;font-variant-numeric:tabular-nums}
input,select{font:inherit;color:inherit;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted)}label>input,label>select{margin-top:4px}
.row{display:grid;gap:8px;grid-template-columns:2fr 1.4fr .8fr auto;align-items:end}
@media (max-width:640px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font-weight:650;background:var(--surface2);color:var(--text)}
button.primary{background:var(--accent);color:#111}button.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
button.link{background:none;padding:4px 6px;color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5}
.search{margin-bottom:10px}
.user{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.user:first-child{border-top:0}
.user .who b{display:block}.user .who small{color:var(--muted);display:block;word-break:break-all}
.user .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.user .meta b{color:var(--text);font-variant-numeric:tabular-nums}
.user .acts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.user.off .who b{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.limit{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--surface2);border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--good)}.sw.on::after{left:23px}
.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--surface2);padding:10px;border-radius:12px}
.edit input{background:var(--surface)}
.edit .btns{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media (max-width:640px){.edit{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:24px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.muted{color:var(--muted)}.small{font-size:13px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:640px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><h1>SDG CalQuest <span>· admin</span></h1><button class="link" id="reload">Osvježi</button></header>
  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>Dodaj polaznika</h2>
    <form class="row" id="addForm" autocomplete="off">
      <label class="wide">E-mail<input name="email" type="email" required placeholder="ime@gmail.com"></label>
      <label>Ime<input name="name" placeholder="Ana Anić"></label>
      <label>Dnevni limit<input name="daily_limit" type="number" min="0" placeholder="zadano"></label>
      <button class="primary" type="submit">Dodaj</button>
    </form>
  </div>

  <div class="card">
    <h2 id="usersTitle">Polaznici</h2>
    <input class="search" id="q" placeholder="Pretraži po imenu ili e-mailu">
    <div id="users"></div>
  </div>

  <div class="card">
    <h2>Postavke</h2>
    <form class="grid3" id="setForm">
      <label>Model za tekst i glas<input name="text_model" list="models"></label>
      <label>Model za fotografije<input name="photo_model" list="models"></label>
      <label>Zadani dnevni limit obrada<input name="daily_limit" type="number" min="1"></label>
      <button class="primary" type="submit">Spremi</button>
    </form>
    <datalist id="models"><option value="claude-haiku-5-5"><option value="claude-sonnet-5-5"></datalist>
    <p class="muted small" style="margin:10px 0 0">Trošak je procjena prema cjeniku u kodu servera; točan iznos vidiš u Claude Consoleu. Isključeni polaznik odmah gubi pristup, a podaci mu ostaju na mobitelu.</p>
  </div>
</main>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => (+n || 0).toLocaleString('hr-HR', {minimumFractionDigits:d, maximumFractionDigits:d});
let data = null, editing = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2500); }
async function api(path, body) {
  const r = await fetch('/admin/api/' + path, {method:body ? 'POST' : 'GET', headers:{'content-type':'application/json', 'x-requested-with':'calquest-admin'},
    body:body ? JSON.stringify(body) : undefined, credentials:'same-origin'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('Greška ' + r.status));
  return j;
}
function ago(iso) {
  if (!iso) return 'nikad';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 2) return 'upravo'; if (m < 60) return `prije ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `prije ${h} h`;
  const d = Math.round(h / 24); return d === 1 ? 'jučer' : `prije ${d} dana`;
}
const device = ua => !ua ? '' : /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'uređaj';
async function load() {
  try { data = await api('overview'); render(); }
  catch (e) { toast(e.message); }
}
function render() {
  const t = data.totals, s = data.settings, act = data.users.filter(u => u.active).length;
  $('#tiles').innerHTML = `
    <div class="tile"><span>Aktivni polaznici</span><b>${act}</b> <span style="display:inline">/ ${data.users.length}</span></div>
    <div class="tile"><span>Obrade danas</span><b>${fmt(t.today_requests)}</b></div>
    <div class="tile"><span>Trošak danas</span><b>$${fmt(t.today_cost, 2)}</b></div>
    <div class="tile"><span>Trošak ovaj mjesec</span><b>$${fmt(t.month_cost, 2)}</b></div>`;
  const f = $('#setForm'); if (!f.dataset.filled) { f.text_model.value = s.text_model; f.photo_model.value = s.photo_model; f.daily_limit.value = s.daily_limit; f.dataset.filled = 1; }
  const q = $('#q').value.trim().toLowerCase();
  const list = data.users.filter(u => !q || u.email.includes(q) || (u.name || '').toLowerCase().includes(q));
  $('#usersTitle').textContent = `Polaznici · ${data.users.length}`;
  if (!data.users.length) { $('#users').innerHTML = `<div class="empty">Još nema polaznika. Dodaj prvog gore.</div>`; return; }
  $('#users').innerHTML = list.map(u => {
    const lim = u.daily_limit ?? s.daily_limit, atLimit = u.today_requests >= lim;
    return `<div class="user ${u.active ? '' : 'off'}" data-email="${esc(u.email)}">
      <button class="sw ${u.active ? 'on' : ''}" data-act="toggle" title="${u.active ? 'Isključi pristup' : 'Uključi pristup'}" aria-label="Pristup"></button>
      <div class="who"><b>${esc(u.name || u.email)}</b>${u.name ? `<small>${esc(u.email)}</small>` : ''}${u.note ? `<small>${esc(u.note)}</small>` : ''}</div>
      <span class="pill ${u.active ? 'on' : ''}">${u.active ? 'aktivan' : 'isključen'}</span>
      <div class="meta"><span>danas <b>${u.today_requests}/${lim}</b>${u.today_photos ? ` (📷 ${u.today_photos})` : ''} ${atLimit ? '<span class="pill limit">limit</span>' : ''}</span>
        <span>30 dana <b>${fmt(u.d30_requests)}</b> · <b>$${fmt(u.d30_cost, 2)}</b></span>
        <span>uređaj: <b>${u.last_seen ? `${device(u.user_agent)} · ${ago(u.last_seen)}` : 'nije prijavljen'}</b></span></div>
      <div class="acts"><button class="link" data-act="edit">Uredi</button>${u.last_seen ? `<button class="link" data-act="logout">Odjavi uređaj</button>` : ''}<button class="link" data-act="del" style="color:var(--bad)">Obriši</button></div>
      ${editing === u.email ? `<form class="edit" data-act="save">
        <label>Ime<input name="name" value="${esc(u.name)}"></label>
        <label>Dnevni limit (prazno = zadano ${s.daily_limit})<input name="daily_limit" type="number" min="0" value="${u.daily_limit ?? ''}"></label>
        <label>Napomena<input name="note" value="${esc(u.note)}"></label>
        <div class="btns"><button type="button" data-act="cancel">Odustani</button><button class="primary" type="submit">Spremi</button></div></form>` : ''}
    </div>`;
  }).join('') || `<div class="empty">Nema rezultata.</div>`;
}
$('#users').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM') return;
  const u = data.users.find(x => x.email === b.closest('.user').dataset.email), act = b.dataset.act;
  try {
    if (act === 'toggle') { await api('user/active', {email:u.email, active:!u.active}); toast(u.active ? `${u.name || u.email}: pristup isključen` : `${u.name || u.email}: pristup uključen`); }
    if (act === 'edit') { editing = editing === u.email ? null : u.email; render(); return; }
    if (act === 'cancel') { editing = null; render(); return; }
    if (act === 'logout') { if (!confirm(`Odjaviti uređaj za ${u.name || u.email}? Morat će se ponovno prijaviti kodom.`)) return; await api('user/logout', {email:u.email}); toast('Uređaj odjavljen'); }
    if (act === 'del') { if (!confirm(`Trajno obrisati ${u.name || u.email}? (Podaci na njegovom mobitelu ostaju, ali više se ne može prijaviti.)`)) return; await api('user/delete', {email:u.email}); toast('Obrisano'); }
    load();
  } catch (err) { toast(err.message); }
});
$('#users').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, email = f.closest('.user').dataset.email;
  try { await api('user', {email, name:f.name.value, daily_limit:f.daily_limit.value, note:f.note.value}); editing = null; toast('Spremljeno'); load(); }
  catch (err) { toast(err.message); }
});
$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, email = f.email.value.trim().toLowerCase();
  if (data?.users.some(u => u.email === email) && !confirm('Polaznik već postoji. Ažurirati ime i limit?')) return;
  try { await api('user', {email, name:f.name.value, daily_limit:f.daily_limit.value}); f.reset(); toast('Polaznik dodan – može se prijaviti'); load(); }
  catch (err) { toast(err.message); }
});
$('#setForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try { await api('settings', {text_model:f.text_model.value, photo_model:f.photo_model.value, daily_limit:f.daily_limit.value}); toast('Postavke spremljene'); load(); }
  catch (err) { toast(err.message); }
});
$('#q').addEventListener('input', render);
$('#reload').addEventListener('click', load);
load();
</script>
</body>
</html>
